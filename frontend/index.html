<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDE Engine</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #1e1e1e; color: #d4d4d4; font-family: system-ui, sans-serif; }
    #app { display: flex; height: 100%; width: 100%; }
    #sidebar { width: 260px; min-width: 200px; max-width: 400px; resize: horizontal; overflow: auto; background: #252526; border-right: 1px solid #333; padding: 0.5rem; }
    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #editor { flex: 1; min-height: 0; }
    #diff-editor { height: 0; overflow: hidden; }
    #diff-editor.visible { flex: 1; height: auto; }
    #terminal { height: 160px; min-height: 80px; max-height: 400px; resize: vertical; overflow: hidden; background: #1e1e1e; border-top: 1px solid #333; }
    #sidebar h3 { font-size: 0.8rem; margin: 0.6rem 0 0.3rem; color: #858585; text-transform: uppercase; }
    .tree-node { padding-left: 0.6rem; font-size: 0.82rem; cursor: pointer; white-space: nowrap; }
    .tree-node:hover { color: #fff; }
    .git-entry { display: flex; justify-content: space-between; padding: 0.15rem 0; font-size: 0.82rem; cursor: pointer; }
    .git-entry:hover { background: #333; }
    .git-status { font-weight: bold; width: 1.5rem; }
    .hidden { display: none; }
    .tab-bar { display: flex; background: #333; }
    .tab { padding: 0.4rem 0.8rem; cursor: pointer; font-size: 0.8rem; }
    .tab.active { background: #1e1e1e; color: #fff; }
  </style>
  <link rel="stylesheet" href="chat_ui.css" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/editor/editor.main.css"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css"
  />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <h3>Explorer</h3>
      <div id="file-tree"></div>
      <h3>Git</h3>
      <div id="git-status"></div>
      <h3>Project</h3>
      <div id="project-info"></div>
    </div>
    <div id="main">
      <div class="tab-bar">
        <div class="tab active" data-view="editor" id="tab-editor">Editor</div>
        <div class="tab" data-view="diff" id="tab-diff">Diff</div>
        <div class="tab" data-view="chat" id="tab-chat">Chat</div>
      </div>
      <div id="editor" class="view active hidden"></div>
      <div id="diff-editor" class="view"></div>
      <!-- Chat Section -->
      <div id="chat-section" class="tab-content" style="display: flex; flex-direction: column; height: 100%;">
          <!-- Chat Header -->
          <div class="chat-header" style="padding: 10px; background: #313244; border-bottom: 1px solid #45475a; display: flex; justify-content: space-between; align-items: center;">
              <select id="room-selector" style="background: #45475a; color: #cdd6f4; border: 1px solid #585b70; padding: 5px 10px; border-radius: 4px;">
                  <option value="General">General</option>
                  <option value="Lobby">Lobby</option>
                  <option value="Project">Project</option>
              </select>
              <span id="connection-status" style="color: #a6e3a1;">🟢 Connected</span>
          </div>

          <!-- Messages Container -->
          <div id="chat-messages" style="flex: 1; overflow-y: auto; padding: 10px; background: #1e1e2e; min-height: 200px; color: #cdd6f4;">
              <!-- Messages will appear here -->
          </div>

          <!-- Input Area -->
          <div class="chat-input-area" style="padding: 10px; background: #313244; border-top: 1px solid #45475a; display: flex; gap: 8px; align-items: center;">
              <div class="input-controls" style="display: flex; gap: 4px;">
                  <button id="voice-btn" style="background: #45475a; border: 1px solid #585b70; color: #cdd6f4; padding: 5px 8px; border-radius: 4px; cursor: pointer;">🎙️</button>
                  <button id="image-btn" style="background: #45475a; border: 1px solid #585b70; color: #cdd6f4; padding: 5px 8px; border-radius: 4px; cursor: pointer;">🖼️</button>
                  <button id="pdf-btn" style="background: #45475a; border: 1px solid #585b70; color: #cdd6f4; padding: 5px 8px; border-radius: 4px; cursor: pointer;">📄</button>
              </div>
              <input type="text" id="chat-input" placeholder="Type a message..." style="flex: 1; padding: 8px 12px; background: #1e1e2e; color: #cdd6f4; border: 1px solid #45475a; border-radius: 4px; outline: none;" />
              <button id="send-btn" style="padding: 8px 16px; background: #89b4fa; color: #11111b; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Send</button>
          </div>
      </div>
      <div id="terminal"></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
  <script src="editor.js"></script>
  <script src="chat_ui.js"></script>
</body>
</html>
