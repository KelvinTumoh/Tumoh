<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDE Core Workbench</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />
  <link rel="stylesheet" href="workbench.css" />
  <link rel="stylesheet" href="chat_ui.css" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/editor/editor.main.css"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css"
  />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
</head>
<body>
  <div id="workbench" role="main" aria-label="IDE Workbench">
    <!-- Activity bar -->
    <nav id="activity-bar" role="navigation" aria-label="Activity Bar">
      <button class="activity-btn active" data-view="explorer-view" title="Explorer" aria-label="Explorer">📁</button>
      <button class="activity-btn" data-view="search-view" title="Search" aria-label="Search">🔍</button>
      <button class="activity-btn" data-view="git-view" title="Source Control" aria-label="Source Control">🌿</button>
      <button class="activity-btn" data-view="chat-sidebar" title="Chat" aria-label="Chat">💬</button>
    </nav>

    <!-- Sidebar -->
    <aside id="sidebar" role="complementary" aria-label="Sidebar">
      <div class="sidebar-header">
        <span id="sidebar-title">Explorer</span>
      </div>
      <div id="explorer-view" class="sidebar-view">
        <h3>Explorer</h3>
        <div id="file-tree"></div>
        <h3>Project</h3>
        <div id="project-info"></div>
      </div>
      <div id="search-view" class="sidebar-view hidden">
        <h3>Search</h3>
        <p style="font-size: 0.8rem; color: #858585;">Search across files coming soon.</p>
      </div>
      <div id="git-view" class="sidebar-view hidden">
        <h3>Git</h3>
        <div id="git-status"></div>
      </div>
      <div id="chat-sidebar" class="sidebar-view hidden">
        <h3>Chat Rooms</h3>
        <p style="font-size: 0.8rem; color: #858585;">Use the chat panel below.</p>
      </div>
    </aside>

    <!-- Main area -->
    <div id="main-area">
      <div id="tab-bar" role="tablist" aria-label="Editor Tabs">
        <div class="tab active" data-view="editor" role="tab" aria-selected="true">Editor</div>
        <div class="tab" data-view="diff-editor" role="tab" aria-selected="false">Diff</div>
      </div>

      <div id="editor-area">
        <div id="editor" class="view" role="tabpanel" aria-label="Code Editor"></div>
        <div id="diff-editor" class="view hidden" role="tabpanel" aria-label="Diff Editor"></div>
      </div>

      <!-- Bottom panel -->
      <div id="bottom-panel" aria-label="Bottom Panel">
        <div id="panel-header" role="tablist" aria-label="Bottom Panel Tabs">
          <div class="panel-tab" data-panel="terminal" role="tab" aria-selected="false">Terminal</div>
          <div class="panel-tab active" data-panel="chat-section" role="tab" aria-selected="true">Chat</div>
          <div class="panel-tab" data-panel="output" role="tab" aria-selected="false">Output</div>
        </div>
        <div id="panel-body">
          <div id="terminal" class="panel hidden" role="tabpanel" aria-label="Terminal"></div>
          <div id="chat-section" class="panel" role="tabpanel" aria-label="Chat">
            <div class="chat-header" style="padding: 10px; background: #313244; border-bottom: 1px solid #45475a; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;">
              <select id="room-selector" style="background: #45475a; color: #cdd6f4; border: 1px solid #585b70; padding: 5px 10px; border-radius: 4px;">
                <option value="General">General</option>
                <option value="Lobby">Lobby</option>
                <option value="Project">Project</option>
              </select>
              <span id="connection-status" style="color: #a6e3a1;">Connected</span>
            </div>
            <div id="chat-messages" style="flex: 1; overflow-y: auto; padding: 10px; background: #1e1e2e; min-height: 0; color: #cdd6f4;">
              <!-- Messages will appear here -->
            </div>
            <div class="chat-input-area" style="padding: 10px; background: #313244; border-top: 1px solid #45475a; display: flex; gap: 8px; align-items: center; flex-shrink: 0;">
              <div class="input-controls" style="display: flex; gap: 4px;">
                <button id="voice-btn" style="background: #45475a; border: 1px solid #585b70; color: #cdd6f4; padding: 5px 8px; border-radius: 4px; cursor: pointer;">🎙️</button>
                <button id="image-btn" style="background: #45475a; border: 1px solid #585b70; color: #cdd6f4; padding: 5px 8px; border-radius: 4px; cursor: pointer;">🖼️</button>
                <button id="pdf-btn" style="background: #45475a; border: 1px solid #585b70; color: #cdd6f4; padding: 5px 8px; border-radius: 4px; cursor: pointer;">📄</button>
              </div>
              <input type="text" id="chat-input" placeholder="Type a message..." style="flex: 1; padding: 8px 12px; background: #1e1e2e; color: #cdd6f4; border: 1px solid #45475a; border-radius: 4px; outline: none;" />
              <button id="send-btn" style="padding: 8px 16px; background: #89b4fa; color: #11111b; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Send</button>
            </div>
          </div>
          <div id="output" class="panel hidden" role="tabpanel" aria-label="Output">
            <pre style="padding: 0.5rem; font-size: 0.8rem; color: #858585;">Build output will appear here.</pre>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer id="status-bar" role="contentinfo" aria-label="Status Bar">
    <div class="left">
      <span id="status-message">Ready</span>
    </div>
    <div class="right">
      <span id="status-language">Python</span>
      <span id="status-cursor">Ln 1, Col 1</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
  <script src="editor.js"></script>
  <script src="chat_ui.js"></script>
  <script src="workbench.js"></script>
</body>
</html>
