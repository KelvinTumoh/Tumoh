[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ide-core"
version = "1.0.0"
description = "A modular, open-source IDE core engine with a piece table buffer, LSP client, ReAct agent, terminal PTY, and Git integration."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "IDE Core Contributors"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Integrated Development Environments (IDE)",
]
dependencies = [
    "pytest>=7.4.0",
    "websockets>=17.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.14.0",
    "pyjwt>=2.13.0",
]

[project.urls]
Homepage = "https://github.com/your-org/ide-core"
Repository = "https://github.com/your-org/ide-core"
Issues = "https://github.com/your-org/ide-core/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ide_core*"]
